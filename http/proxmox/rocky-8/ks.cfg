cdrom
text
firstboot --disabled
eula --agreed
lang en_UK.UTF-8 --addsupport=en_US
keyboard uk
network --bootproto=dhcp --onboot=on --device=link --activate
rootpw --lock
firewall --disabled
selinux --permissive
timezone UTC
skipx
zerombr
clearpart --all --initlabel
bootloader --location=mbr
autopart --type=lvm

authselect select sssd with-faillock
user --name=vagrant --plaintext --password vagrant

%packages --ignoremissing --excludedocs
@core
openssh-clients
openssh-server
dnf-utils
python3
qemu-guest-agent
sudo
sssd
-aic94xx-firmware
-atmel-firmware
-b43-openfwwf
-bfa-firmware
-ipw2100-firmware
-ipw2200-firmware
-ivtv-firmware
-iwl*-firmware
-libertas-usb8388-firmware
-ql*-firmware
-rt61pci-firmware
-rt73usb-firmware
-xorg-x11-drv-ati-firmware
-zd1211-firmware
-cockpit
-quota
-alsa-*
-fprintd-pam
-intltool
-microcode_ctl
%end

%post --erroronfail
set -e

mkdir -p /etc/sudoers.d
echo "%vagrant ALL=(ALL) NOPASSWD: ALL" > /etc/sudoers.d/vagrant
chmod 0440 /etc/sudoers.d/vagrant

dnf install -y sudo perl-interpreter qemu-guest-agent
systemctl enable sshd qemu-guest-agent
%end

reboot --eject