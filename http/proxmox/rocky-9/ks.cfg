cdrom
text
firstboot --disabled
eula --agreed
lang en_UK.UTF-8 --addsupport=en_US
keyboard uk
network --bootproto=dhcp --onboot=on --device=link --activate
rootpw --lock
firewall --disabled
selinux --permissive
timezone UTC
skipx
zerombr
clearpart --all --initlabel
bootloader --location=mbr

# Use manual partitioning to preserve a fixed 16 GiB swap LV and a separate /boot partition
part pv.01 --size=1 --grow --ondisk=sda
volgroup vg_system --pesize=4096 pv.01
logvol swap --name=swap --vgname=vg_system --size=16000 --maxsize=16000
logvol / --name=root --vgname=vg_system --fstype=xfs --grow --size=1
part /boot --fstype=ext4 --size=1000

authselect select sssd with-faillock
user --name=vagrant --plaintext --password vagrant

%packages --ignoremissing --excludedocs
@core
openssh-clients
openssh-server
dnf-utils
python3
qemu-guest-agent
sudo
sssd
-alsa-firmware
-alsa-sof-firmware
-alsa-tools-firmware
-iwl*-firmware
-fprintd-pam
-intltool
%end

%post --erroronfail
set -e

mkdir -p /etc/sudoers.d
echo "%vagrant ALL=(ALL) NOPASSWD: ALL" > /etc/sudoers.d/vagrant
chmod 0440 /etc/sudoers.d/vagrant

dnf install -y sudo perl-interpreter qemu-guest-agent
systemctl enable sshd qemu-guest-agent
%end

reboot --eject
