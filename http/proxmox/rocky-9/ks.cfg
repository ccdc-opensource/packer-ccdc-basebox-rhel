cdrom
lang en_UK.UTF-8 --addsupport=en_US
keyboard --xlayouts='gb'
network --bootproto=dhcp --onboot=on --device=link --activate
rootpw --lock
firewall --disabled
selinux --permissive
timezone UTC
bootloader --location=mbr
text
firstboot --disabled
eula --agreed
skipx
clearpart --all --initlabel

part pv.008002 --size=1 --grow --ondisk=sda
volgroup VolGroup --pesize=4096 pv.008002
logvol swap --name=lv_swap --vgname=VolGroup --size=16000 --maxsize=16000
logvol / --name=lv_root --vgname=VolGroup --fstype=xfs --grow --size=1
part /boot --fstype=ext4 --size=1000
authselect select sssd with-faillock
user --name=vagrant --plaintext --password vagrant

%packages --ignoremissing --excludedocs
@core
openssh-clients
openssh-server
dnf-utils
perl-interpreter
python3
qemu-guest-agent
sudo
-fprintd-pam
-intltool
-aic94xx-firmware
-alsa-firmware
-alsa-tools-firmware
-ivtv-firmware
-iwl100-firmware
-iwl105-firmware
-iwl135-firmware
-iwl1000-firmware
-iwl2000-firmware
-iwl2030-firmware
-iwl3160-firmware
-iwl3945-firmware
-iwl4965-firmware
-iwl5000-firmware
-iwl5150-firmware
-iwl6000-firmware
-iwl6000g2a-firmware
-iwl6000g2b-firmware
-iwl6050-firmware
-iwl7260-firmware
-iwl7265-firmware
%end

%post --erroronfail
set -e
mkdir -p /etc/sudoers.d
echo "%vagrant ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers.d/vagrant
chmod 0440 /etc/sudoers.d/vagrant
dnf makecache
dnf install -y python3 openssh-server qemu-guest-agent sudo
python3 --version
rpm -q openssh-server qemu-guest-agent sudo
dnf install epel-release -y
dnf makecache
dnf install -y sudo perl-interpreter
systemctl enable sshd qemu-guest-agent
%end
reboot --eject
